; ARO - All Races Open settings (1 = on, 0 = off)
[ARO]
; every race for every car (parts only come from a race's original cars)
OpenRaces=1
; give race opponents other cars (from your class, a chosen class, or a real-world match - see the F5 menu)
RandomOpponents=1
; random paint for swapped opponents
RandomPaint=1
; Most Wanted races keep their boss car
KeepMostWantedBoss=1
; avoid two opponents in the same car
UniqueOpponents=1
; races where opponents always keep their own cars (event ids, comma separated). Get To Callahan
; and Round Trip have 11 opponents and never start when their cars are swapped
KeepOpponentsIn=2189981,2193106
; opponents never get the car you are driving
NeverGiveOpponentsMyCar=1
; base the EasyDrive NEW badge on each car's own races
FixNewBadge=1
; F5 in-game menu
Menu=1
; key that opens the menu: F1-F12, Insert, Home, End, PageUp, PageDown, Delete, Pause, ScrollLock,
; a letter or digit, or a key code like 0x2D. A gamepad always works with L3+R3
MenuKey=F5
; write which game code asks for each racer car (helps tell race grids from jack spots)
LogCallers=0
; developer memory probe on 127.0.0.1:47777 - leave off
DevProbe=0
